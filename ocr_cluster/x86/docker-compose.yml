# Local x86 analog of the ocr_cluster/dgx stack (docker-compose-inference-node.yml
# and docker-compose-lb.yml merged into one file):
#
#   gateway (nginx edge, API-key auth, publishes 8080)
#     -> hybrid-gateway (fuses structure layout + VLM recognition)
#       -> ort-structure (PP-StructureV3 geometry on the host GPU, no Paddle;
#          the structure backend)
#       -> vlm-server (SGLang PaddleOCR-VL, OpenAI /v1 chat API). The gateway
#          calls it directly for every crop; there is no Paddle serving hop.
#
# The structure backend is chosen by STRUCTURE_GATEWAY_URL (which hybrid-gateway
# posts page images to). It defaults to ort-structure. There is no second layout
# stack in this file. Rollback is a commit revert, not an env change.
#
# The inference services share the single host GPU (16 GB on my system): SGLang
# holds ~6.6 GB at mem-fraction-static=0.4 (1.9 GB weights + ~4.8 GB KV cache)
# and ort-structure's five ONNX models hold ~3.7 GB. Together that is ~10.3 GB;
# ORT_MEM_CAP exists to trim ORT's share on a memory-tight host.
name: yarrow

services:
  vlm-server:
    image: lmsysorg/sglang:v0.5.22-cu130-runtime@sha256:c3d99f078c329a5b2d0c0c02c4237cf8b0dcd1dc6f875a943ae163c1720854cb
    command:
      - python3
      - -m
      - sglang.launch_server
      - --model-path=PaddlePaddle/PaddleOCR-VL
      - --served-model-name=PaddleOCR-VL-0.9B
      - --host=0.0.0.0
      - --port=8000
      - --trust-remote-code
      - --context-length=16384
      - --max-running-requests=16
      - --mem-fraction-static=0.4
      - --disable-radix-cache
      - --enable-metrics
    volumes:
      - vlm-hf-cache:/root/.cache/huggingface
    shm_size: "2gb"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 60
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped


  ort-structure:
    build:
      context: ../shared/ort-structure
      dockerfile: Dockerfile
    image: yarrow-ort-structure:latest
    environment:
      STRUCTURE_API_KEY: "${STRUCTURE_API_KEY:?set STRUCTURE_API_KEY in .env}"
      CUDA_DEVICE_ID: "0"
      MODEL_DIR: /opt/ort/models
      # Per-model GPU memory cap, off by default
      ORT_MEM_CAP: "0"
    mem_limit: 6g
    healthcheck:
      # /ready returns 503 until the structure models are loaded, 200 when they
      # are. 600 s start_period covers the five-model load on a contended GPU.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready')"]
      start_period: 600s
      interval: 15s
      timeout: 10s
      retries: 60
    deploy:
      replicas: 1
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  hybrid-gateway:
    build:
      context: ../shared
      dockerfile: hybrid-gateway.Dockerfile
    environment:
      VLM_URL: "${VLM_URL:-http://vlm-server:8000/v1}"
      VLM_MODEL: "${VLM_MODEL:-}"
      VLM_MAX_INFLIGHT: "${VLM_MAX_INFLIGHT:-16}"
      VLM_MAX_COMPLETION_TOKENS: "${VLM_MAX_COMPLETION_TOKENS:-8192}"
      VLM_JPEG_QUALITY: "${VLM_JPEG_QUALITY:-75}"
      STRUCTURE_MAX_INFLIGHT: "${STRUCTURE_MAX_INFLIGHT:-2}"
      STRUCTURE_QUEUE_TIMEOUT: "${STRUCTURE_QUEUE_TIMEOUT:-120}"
      GATEWAY_DEADLINE: "${GATEWAY_DEADLINE:-480}"
      VLM_PIXEL_BUDGETS: "${VLM_PIXEL_BUDGETS:-}"
      REQUEST_TIMEOUT: "${REQUEST_TIMEOUT:-300}"
      STRUCTURE_GATEWAY_URL: "${STRUCTURE_GATEWAY_URL:-http://ort-structure:8080/layout-parsing}"
      STRUCTURE_API_KEY: "${STRUCTURE_API_KEY:?set STRUCTURE_API_KEY in .env}"
      MODEL_NAME: "${MODEL_NAME:?set MODEL_NAME in .env}"
      MODEL_VERSION: "${MODEL_VERSION:?set MODEL_VERSION in .env}"
    depends_on:
      ort-structure:
        condition: service_healthy
      vlm-server:
        condition: service_healthy
    healthcheck:
      # /ready checks ort-structure and the VLM /models endpoint.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready')"]
      start_period: 20s
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  gateway:
    image: nginx:1.31-alpine@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
    depends_on:
      hybrid-gateway:
        condition: service_healthy
    configs:
      - source: nginx-config
        target: /etc/nginx/templates/nginx.conf.template
    environment:
      GATEWAY_API_KEY: "${GATEWAY_API_KEY:?set GATEWAY_API_KEY in ocr_cluster/x86/.env}"
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      NGINX_ENVSUBST_FILTER: "^GATEWAY_"
    # nginx resolves the hybrid-gateway upstream hostname once at startup;
    # starting before that container exists is a fatal boot error, so wait
    # for it to be healthy first.
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 10s
    restart: unless-stopped

volumes:
  vlm-hf-cache:

configs:
  nginx-config:
    file: ../shared/nginx.conf.template
