# Local x86 analog of the ocr_cluster/dgx stack (docker-compose-inference-node.yml
# and docker-compose-lb.yml merged into one file):
#
#   gateway (nginx edge, API-key auth, publishes 8080)
#     -> hybrid-gateway (fuses structure layout + PaddleOCR-VL recognition)
#       -> ort-structure (PP-StructureV3 geometry on the host GPU, no Paddle;
#          the structure backend)
#       -> paddleocr-vl-api (PaddleOCR-VL layout on the host GPU, VLM via vlm-server)
#         -> vlm-server (PaddlePaddle/PaddleOCR-VL on the host GPU)
#
# The structure backend is chosen by STRUCTURE_GATEWAY_URL (which hybrid-gateway
# posts page images to). It defaults to ort-structure. There is no second layout
# stack in this file: the pre-cutover paddlex-pipeline service was removed at
# merge (roll back by reverting the commit, which restores it).
#
# The inference services share the single host GPU (16 GB on my system): SGLang
# holds ~6.6 GB at mem-fraction-static=0.4 (1.9 GB weights + ~4.8 GB KV cache),
# the Paddle layout models (PP-OCRv5 mobile det/rec + PP-DocLayoutV2) in
# paddleocr-vl-api hold ~2.5 GB, and ort-structure's five ONNX models hold
# ~3.7 GB. Together that is ~12.8 GB; ORT_MEM_CAP exists to trim ORT's share on
# a memory-tight host.
name: yarrow

# x-pipeline-image: shared build definition for the two services that run the
# PP-StructureV3 / PaddleOCR-VL paddlex image. Each service keeps its own image
# tag: compose builds every service that declares a build, and with both
# exporting the SAME tag the two exports race and one aborts with
# "image ... already exists". Distinct tags avoid that; identical content means
# the layers are content-addressed and shared anyway.
x-pipeline-image: &pipeline-image
  build:
    context: .
    dockerfile: paddlex.Dockerfile
    additional_contexts:
      - shared=../shared

services:
  vlm-server:
    image: lmsysorg/sglang:v0.5.22-cu130-runtime@sha256:c3d99f078c329a5b2d0c0c02c4237cf8b0dcd1dc6f875a943ae163c1720854cb
    command:
      - python3
      - -m
      - sglang.launch_server
      - --model-path=PaddlePaddle/PaddleOCR-VL
      - --served-model-name=PaddleOCR-VL-0.9B
      - --host=0.0.0.0
      - --port=8000
      - --trust-remote-code
      - --context-length=8192
      - --max-running-requests=16
      - --mem-fraction-static=0.4
      - --disable-radix-cache
      - --enable-metrics
    volumes:
      - vlm-hf-cache:/root/.cache/huggingface
    shm_size: "2gb"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 60
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped


  ort-structure:
    build:
      context: ../shared/ort-structure
      dockerfile: Dockerfile
    image: yarrow-ort-structure:latest
    environment:
      STRUCTURE_API_KEY: "${STRUCTURE_API_KEY:?set STRUCTURE_API_KEY in .env}"
      CUDA_DEVICE_ID: "0"
      MODEL_DIR: /opt/ort/models
      # Per-model GPU memory cap, off by default
      ORT_MEM_CAP: "0"
    mem_limit: 6g
    healthcheck:
      # /ready returns 503 until the structure models are loaded, 200 when they
      # are. 600 s start_period covers the five-model load on a contended GPU.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready')"]
      start_period: 600s
      interval: 15s
      timeout: 10s
      retries: 60
    deploy:
      replicas: 1
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  paddleocr-vl-api:
    <<: *pipeline-image
    image: yarrow-paddleocr-vl-api:latest
    environment:
      PIPELINE_NAME: PaddleOCR-VL
      VLM_BACKEND: sglang-server
      VLM_SERVER_URL: http://vlm-server:8000/v1
      DEVICE: gpu
    depends_on:
      vlm-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 300s
    deploy:
      replicas: 1
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  hybrid-gateway:
    build:
      context: ../shared
      dockerfile: hybrid-gateway.Dockerfile
    environment:
      STRUCTURE_GATEWAY_URL: "${STRUCTURE_GATEWAY_URL:-http://ort-structure:8080/layout-parsing}"
      STRUCTURE_API_KEY: "${STRUCTURE_API_KEY:?set STRUCTURE_API_KEY in .env}"
      VL_GATEWAY_URL: http://paddleocr-vl-api:8080/layout-parsing
      MODEL_NAME: "${MODEL_NAME:?set MODEL_NAME in .env}"
      MODEL_VERSION: "${MODEL_VERSION:?set MODEL_VERSION in .env}"
    depends_on:
      ort-structure:
        condition: service_healthy
      paddleocr-vl-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      start_period: 20s
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  gateway:
    image: nginx:1.31-alpine@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
    depends_on:
      hybrid-gateway:
        condition: service_healthy
    configs:
      - source: nginx-config
        target: /etc/nginx/templates/nginx.conf.template
    environment:
      GATEWAY_API_KEY: "${GATEWAY_API_KEY:?set GATEWAY_API_KEY in ocr_cluster/x86/.env}"
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      NGINX_ENVSUBST_FILTER: "^GATEWAY_"
    # nginx resolves the hybrid-gateway upstream hostname once at startup;
    # starting before that container exists is a fatal boot error, so wait
    # for it to be healthy first.
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 10s
    restart: unless-stopped

volumes:
  vlm-hf-cache:

configs:
  nginx-config:
    file: ../shared/nginx.conf.template
