# Built from paddlex.Dockerfile. The Paddle source build is the first stage and
# stays cached; shared/entrypoint.sh and paddlex_wrapper.py copy in the last
# layers, so a script edit rebuilds in seconds. If the build cache is evicted,
# --build recompiles Paddle from source (hours).
# from source (hours).
x-pipeline-image: &pipeline-image
  image: ${PIPELINE_IMAGE:-paddleocr-pipeline:gpu}
  build:
    context: .
    dockerfile: paddlex.Dockerfile
    additional_contexts:
      - shared=../shared

services:
  # Paddle-free PP-StructureV3 structure service. It
  # is the structure backend on this node: the gateway posts every page to it
  # See shared/ort-structure/README.md.
  ort-structure:
    build:
      context: ../shared/ort-structure
      dockerfile: Dockerfile
    image: yarrow-ort-structure:latest
    environment:
      STRUCTURE_API_KEY: "${STRUCTURE_API_KEY:?set STRUCTURE_API_KEY in .env}"
      CUDA_DEVICE_ID: "0"
      MODEL_DIR: /opt/ort/models
      ORT_MEM_CAP: "0"
    mem_limit: 6g
    healthcheck:
      # /ready returns 503 until the five models load; 600 s start_period covers
      # the load on a contended GPU.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready')"]
      start_period: 600s
      interval: 15s
      timeout: 10s
      retries: 60
    deploy:
      replicas: 1
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  vlm-server:
    image: nvcr.io/nvidia/vllm:25.12.post1-py3
    command:
      - vllm
      - serve
      - PaddlePaddle/PaddleOCR-VL
      - --served-model-name=PaddleOCR-VL-0.9B
      - --host=0.0.0.0
      - --port=8000
      - --trust-remote-code
      - --mm-encoder-attn-backend=TORCH_SDPA
      - --gpu-memory-utilization=0.10
      - --kv-cache-memory-bytes=1073741824
      - --max-model-len=8192
      - --max-num-seqs=16
      - --max-num-batched-tokens=8192
      - --no-enable-prefix-caching
      - --mm-processor-cache-gb=0
    volumes:
      - rec-server-cache:/root/.cache/huggingface
    shm_size: "2gb"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 300s
    deploy:
      replicas: 1
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  paddleocr-vl-api:
    <<: *pipeline-image
    environment:
      PIPELINE_NAME: PaddleOCR-VL
      VLM_SERVER_URL: http://vlm-server:8000/v1
    depends_on:
      - vlm-server
    deploy:
      replicas: 1
      # replicas: 8
    mem_limit: 2g
    restart: unless-stopped

  hybrid-gateway:
    build:
      context: ../shared
      dockerfile: hybrid-gateway.Dockerfile
    environment:
      STRUCTURE_GATEWAY_URL: "${STRUCTURE_GATEWAY_URL:-http://ort-structure:8080/layout-parsing}"
      STRUCTURE_API_KEY: "${STRUCTURE_API_KEY:?set STRUCTURE_API_KEY in .env}"
      VL_GATEWAY_URL: http://paddleocr-vl-api:8080/layout-parsing
      MODEL_NAME: "${MODEL_NAME:?set MODEL_NAME in .env}"
      MODEL_VERSION: "${MODEL_VERSION:?set MODEL_VERSION in .env}"
    depends_on:
      # ort-structure is the structure backend; wait for its five models to
      # load before the gateway starts serving.
      ort-structure:
        condition: service_healthy
      paddleocr-vl-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  rec-server-cache:
