# Inference node for the hybrid gateway. The gateway posts each page to
# ort-structure for layout, then calls the VLM chat API directly for every crop;
# there is no Paddle serving hop.
#
# ort-structure and the gateway are built locally; vlm-server pulls a pinned
# vLLM image. ORT_MEM_CAP trims ORT's GPU share on a memory-tight host.

services:
  # Paddle-free PP-StructureV3 structure service. It
  # is the structure backend on this node: the gateway posts every page to it
  # See shared/ort-structure/README.md.
  ort-structure:
    build:
      context: ../shared/ort-structure
      dockerfile: Dockerfile
    image: yarrow-ort-structure:latest
    environment:
      STRUCTURE_API_KEY: "${STRUCTURE_API_KEY:?set STRUCTURE_API_KEY in .env}"
      CUDA_DEVICE_ID: "0"
      MODEL_DIR: /opt/ort/models
      ORT_MEM_CAP: "0"
    mem_limit: 6g
    healthcheck:
      # /ready returns 503 until the five models load; 600 s start_period covers
      # the load on a contended GPU.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready')"]
      start_period: 600s
      interval: 15s
      timeout: 10s
      retries: 60
    deploy:
      replicas: 1
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  vlm-server:
    image: nvcr.io/nvidia/vllm:25.12.post1-py3
    command:
      - vllm
      - serve
      - PaddlePaddle/PaddleOCR-VL
      - --served-model-name=PaddleOCR-VL-0.9B
      - --host=0.0.0.0
      - --port=8000
      - --trust-remote-code
      - --mm-encoder-attn-backend=TORCH_SDPA
      - --gpu-memory-utilization=0.10
      - --kv-cache-memory-bytes=1073741824
      - --max-model-len=16384
      - --max-num-seqs=16
      - --max-num-batched-tokens=8192
      - --no-enable-prefix-caching
      - --mm-processor-cache-gb=0
    volumes:
      - rec-server-cache:/root/.cache/huggingface
    shm_size: "2gb"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 300s
    deploy:
      replicas: 1
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  hybrid-gateway:
    build:
      context: ../shared
      dockerfile: hybrid-gateway.Dockerfile
    environment:
      VLM_URL: "${VLM_URL:-http://vlm-server:8000/v1}"
      VLM_MODEL: "${VLM_MODEL:-}"
      VLM_MAX_INFLIGHT: "${VLM_MAX_INFLIGHT:-16}"
      VLM_MAX_COMPLETION_TOKENS: "${VLM_MAX_COMPLETION_TOKENS:-8192}"
      VLM_JPEG_QUALITY: "${VLM_JPEG_QUALITY:-75}"
      STRUCTURE_MAX_INFLIGHT: "${STRUCTURE_MAX_INFLIGHT:-2}"
      STRUCTURE_QUEUE_TIMEOUT: "${STRUCTURE_QUEUE_TIMEOUT:-120}"
      GATEWAY_DEADLINE: "${GATEWAY_DEADLINE:-480}"
      VLM_PIXEL_BUDGETS: "${VLM_PIXEL_BUDGETS:-}"
      REQUEST_TIMEOUT: "${REQUEST_TIMEOUT:-300}"
      STRUCTURE_GATEWAY_URL: "${STRUCTURE_GATEWAY_URL:-http://ort-structure:8080/layout-parsing}"
      STRUCTURE_API_KEY: "${STRUCTURE_API_KEY:?set STRUCTURE_API_KEY in .env}"
      MODEL_NAME: "${MODEL_NAME:?set MODEL_NAME in .env}"
      MODEL_VERSION: "${MODEL_VERSION:?set MODEL_VERSION in .env}"
    depends_on:
      # ort-structure is the structure backend; wait for its five models to
      # load before the gateway starts serving.
      ort-structure:
        condition: service_healthy
      vlm-server:
        condition: service_healthy
    healthcheck:
      # /ready checks ort-structure and the VLM /models endpoint.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  rec-server-cache:
