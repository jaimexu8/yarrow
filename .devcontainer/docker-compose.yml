# Dev services for the Yarrow devcontainer.
# GENERATED FILE - do not edit by hand.
# Regenerate after editing ../docker-compose.yml:
#   python3 scripts/sync-dev-compose.py
#
# Shared infra services are copied verbatim from ../docker-compose.yml with
# their container_name prefixed yarrow_dev (container names are global across
# compose projects, so this keeps the dev project from colliding with the root
# project). App services are dropped; the devcontainer service is added.
name: yarrow_dev

services:
  devcontainer:
    image: mcr.microsoft.com/devcontainers/python:1-3.11-bookworm
    container_name: yarrow_devcontainer
    user: "vscode"
    working_dir: /workspace
    volumes:
      - ../:/workspace
    command: sleep infinity
    restart: unless-stopped

  postgres:
    image: paradedb/paradedb:pg18@sha256:a9cbdcfd8a1c349ab21590fd6d6dcbe7da489878df6502922d032dd64c1a7ae7
    container_name: yarrow_dev_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yarrow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yarrow_password}
      POSTGRES_DB: ${POSTGRES_DB:-yarrow}
      PGDATA: /var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-yarrow} -d ${POSTGRES_DB:-yarrow}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  valkey:
    image: valkey/valkey:9.0-alpine@sha256:187679e3bd4036959631e3f03983ab2ba503ab21e6fd0454d508e909db2ee989
    container_name: yarrow_dev_valkey
    # Append-only log, synced every second, so logouts (revoked tokens,
    # US-19) survive a crash. The default snapshots alone could lose minutes
    # of revocations, letting logged-out tokens work again after a restart.
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:1.0.0
    container_name: yarrow_dev_rustfs
    environment:
      RUSTFS_VOLUMES: /data/rustfs0
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      RUSTFS_OBS_LOG_DIRECTORY: /app/logs
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data/rustfs0
      - rustfs_logs:/app/logs
    depends_on:
      rustfs-volumes:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: "no"

  rustfs-volumes:
    image: alpine:3.22
    container_name: yarrow_dev_rustfs_volumes
    command: sh -c "chown -R 10001:10001 /data /logs"
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/logs
    restart: "no"

  create-bucket:
    image: rustfs/rc:v0.1.36
    container_name: yarrow_dev_s3_setup
    depends_on:
      rustfs:
        condition: service_healthy
    # Anonymous access is public read-only (list/get, no put). To allow
    # anonymous writes instead, change "download" to "public" below.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        rc alias set rustfs http://rustfs:9000 ${S3_ACCESS_KEY:-rustfsadmin} ${S3_SECRET_KEY:-rustfsadmin}
        && rc mb rustfs/${S3_BUCKET_NAME:-yarrow-documents} --ignore-existing
        && rc anonymous set download rustfs/${S3_BUCKET_NAME:-yarrow-documents}

volumes:
  pg_data:
  valkey_data:
  rustfs_data:
  rustfs_logs:
