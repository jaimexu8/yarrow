services:
  postgres:
    image: paradedb/paradedb:pg18@sha256:a9cbdcfd8a1c349ab21590fd6d6dcbe7da489878df6502922d032dd64c1a7ae7
    container_name: yarrow_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yarrow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yarrow_password}
      POSTGRES_DB: ${POSTGRES_DB:-yarrow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-yarrow} -d ${POSTGRES_DB:-yarrow}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  valkey:
    image: valkey/valkey:9.0-alpine@sha256:187679e3bd4036959631e3f03983ab2ba503ab21e6fd0454d508e909db2ee989
    container_name: yarrow_valkey
    # Append-only log, synced every second, so logouts (revoked tokens,
    # US-19) survive a crash. The default snapshots alone could lose minutes
    # of revocations, letting logged-out tokens work again after a restart.
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:1.0.0
    container_name: yarrow_rustfs
    environment:
      RUSTFS_VOLUMES: /data/rustfs0
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      RUSTFS_OBS_LOG_DIRECTORY: /app/logs
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data/rustfs0
      - rustfs_logs:/app/logs
    depends_on:
      rustfs-volumes:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: "no"

  rustfs-volumes:
    image: alpine:3.22
    container_name: yarrow_rustfs_volumes
    command: sh -c "chown -R 10001:10001 /data /logs"
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/logs
    restart: "no"

  create-bucket:
    image: rustfs/rc:v0.1.36
    container_name: yarrow_s3_setup
    depends_on:
      rustfs:
        condition: service_healthy
    # Anonymous access is public read-only (list/get, no put). To allow
    # anonymous writes instead, change "download" to "public" below.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        rc alias set rustfs http://rustfs:9000 ${S3_ACCESS_KEY:-rustfsadmin} ${S3_SECRET_KEY:-rustfsadmin}
        && rc mb rustfs/${S3_BUCKET_NAME:-yarrow-documents} --ignore-existing
        && rc anonymous set download rustfs/${S3_BUCKET_NAME:-yarrow-documents}

  mailpit:
    image: axllent/mailpit:latest
    container_name: yarrow_mailpit
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # SMTP
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/readyz"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: yarrow_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./packages:/app/packages
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-yarrow}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-yarrow_password}
      - POSTGRES_DB=${POSTGRES_DB:-yarrow}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - VALKEY_HOST=valkey
      - VALKEY_PORT=6379
      - CELERY_BROKER_URL=redis://valkey:6379/0
      - S3_ENDPOINT=http://rustfs:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-rustfsadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-rustfsadmin}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-yarrow-documents}
      - USE_LOCAL_STORAGE=false
      - SECRET_KEY=${SECRET_KEY:-supersecretkey_please_change_in_production}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - ENFORCE_HTTPS=${ENFORCE_HTTPS:-false}
      # Addresses of the TLS-terminating proxy that uvicorn trusts to report
      # the original https scheme. Must be set when ENFORCE_HTTPS is on behind
      # a proxy, or every request looks like http and redirects forever.
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-127.0.0.1}
      - LOG_EMAIL_BODIES=${LOG_EMAIL_BODIES:-false}
      # Where the frontend is reachable, used to build links in emails.
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-false}
      - EMAIL_FROM=${EMAIL_FROM:-Yarrow <no-reply@yarrow.local>}
      - VERIFICATION_CODE_TTL_MINUTES=${VERIFICATION_CODE_TTL_MINUTES:-15}
      - VERIFICATION_MAX_ATTEMPTS=${VERIFICATION_MAX_ATTEMPTS:-5}
      - VERIFICATION_RESEND_COOLDOWN_SECONDS=${VERIFICATION_RESEND_COOLDOWN_SECONDS:-60}
      - VERIFICATION_MAX_SENDS_PER_HOUR=${VERIFICATION_MAX_SENDS_PER_HOUR:-5}
      - PASSWORD_RESET_TTL_MINUTES=${PASSWORD_RESET_TTL_MINUTES:-30}
      - PASSWORD_RESET_COOLDOWN_SECONDS=${PASSWORD_RESET_COOLDOWN_SECONDS:-60}
      - PASSWORD_RESET_MAX_PER_HOUR=${PASSWORD_RESET_MAX_PER_HOUR:-3}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: yarrow_worker
    # Lets the worker reach the host-local OCR stack (ocr_cluster/x86,
    # published on host port 8080) via INFERENCE_SERVICE_URL.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./worker:/app/worker
      - ./packages:/app/packages
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-yarrow}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-yarrow_password}
      - POSTGRES_DB=${POSTGRES_DB:-yarrow}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - VALKEY_HOST=valkey
      - VALKEY_PORT=6379
      - CELERY_BROKER_URL=redis://valkey:6379/0
      - S3_ENDPOINT=http://rustfs:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-rustfsadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-rustfsadmin}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-yarrow-documents}
      - INFERENCE_SERVICE_URL=${INFERENCE_SERVICE_URL}
      - INFERENCE_API_KEY=${INFERENCE_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    command: celery -A app.celery_app worker --loglevel=info
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yarrow_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pg_data:
  valkey_data:
  rustfs_data:
  rustfs_logs:
