services:
  postgres:
    image: postgres:16-alpine
    container_name: yarrow_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yarrow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yarrow_password}
      POSTGRES_DB: ${POSTGRES_DB:-yarrow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-yarrow} -d ${POSTGRES_DB:-yarrow}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  valkey:
    image: valkey/valkey:7-alpine
    container_name: yarrow_valkey
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    container_name: yarrow_minio
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  create-bucket:
    image: quay.io/minio/mc:latest
    container_name: yarrow_minio_setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/yarrow-documents --ignore-existing;
      /usr/bin/mc anonymous set public myminio/yarrow-documents;
      exit 0;
      "

  mailpit:
    image: axllent/mailpit:latest
    container_name: yarrow_mailpit
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # SMTP
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/readyz"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: yarrow_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./packages:/app/packages
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-yarrow}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-yarrow_password}
      - POSTGRES_DB=${POSTGRES_DB:-yarrow}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - VALKEY_HOST=valkey
      - VALKEY_PORT=6379
      - CELERY_BROKER_URL=redis://valkey:6379/0
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-yarrow-documents}
      - USE_LOCAL_STORAGE=false
      - SECRET_KEY=${SECRET_KEY:-supersecretkey_please_change_in_production}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-false}
      - EMAIL_FROM=${EMAIL_FROM:-Yarrow <no-reply@yarrow.local>}
      - VERIFICATION_CODE_TTL_MINUTES=${VERIFICATION_CODE_TTL_MINUTES:-15}
      - VERIFICATION_MAX_ATTEMPTS=${VERIFICATION_MAX_ATTEMPTS:-5}
      - VERIFICATION_RESEND_COOLDOWN_SECONDS=${VERIFICATION_RESEND_COOLDOWN_SECONDS:-60}
      - VERIFICATION_MAX_SENDS_PER_HOUR=${VERIFICATION_MAX_SENDS_PER_HOUR:-5}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: yarrow_worker
    volumes:
      - ./worker:/app/worker
      - ./packages:/app/packages
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-yarrow}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-yarrow_password}
      - POSTGRES_DB=${POSTGRES_DB:-yarrow}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - VALKEY_HOST=valkey
      - VALKEY_PORT=6379
      - CELERY_BROKER_URL=redis://valkey:6379/0
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-yarrow-documents}
      - INFERENCE_SERVICE_URL=${INFERENCE_SERVICE_URL}
      - INFERENCE_API_KEY=${INFERENCE_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: celery -A app.celery_app worker --loglevel=info
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yarrow_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pg_data:
  valkey_data:
  minio_data: