[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "yarrow-storage"
version = "0.1.0"
description = "Yarrow shared object storage providers"
authors = ["Team 13"]
packages = [{ include = "yarrow_storage", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
boto3 = "*"
pydantic-settings = "*"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008", "BLE001"]
