name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: paradedb/paradedb:pg18@sha256:a9cbdcfd8a1c349ab21590fd6d6dcbe7da489878df6502922d032dd64c1a7ae7
        env:
          POSTGRES_USER: yarrow
          POSTGRES_PASSWORD: yarrow_password
          POSTGRES_DB: yarrow
        ports:
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      valkey:
        image: valkey/valkey:9.2-alpine@sha256:cdcb7b1c7b6f1c9cb9442c71ac6275e78184657448407b2c1fdde7ee8024f4fb
        ports:
          - 6379

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install poetry==2.5.1
          cd backend
          poetry config virtualenvs.create false
          # The backend is a non-packaged project (no `packages`/`package-mode`
          # set), so installing the root project errors on poetry >= 2. Use
          # --no-root, matching the backend/worker Dockerfiles.
          poetry install --no-root
      - name: Lint and Format Check
        run: |
          cd backend
          ruff check .
      - name: Run Tests
        env:
          POSTGRES_USER: yarrow
          POSTGRES_PASSWORD: yarrow_password
          POSTGRES_DB: yarrow
          POSTGRES_HOST: localhost
          POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
          VALKEY_HOST: localhost
          VALKEY_PORT: ${{ job.services.valkey.ports[6379] }}
        run: |
          cd backend
          pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Lint and Format Check
        run: |
          cd frontend
          npm run lint
          npx prettier --check .
      - name: Type Check
        run: |
          cd frontend
          npx tsc --noEmit
      - name: Build
        run: |
          cd frontend
          npm run build

  compose-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Check dev compose is in sync with root compose
        run: python3 scripts/sync-dev-compose.py --check
