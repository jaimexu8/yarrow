name: CI (compose)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    paths:
      - "docker-compose.yml"
      - ".devcontainer/**"
      - "scripts/sync-dev-compose.py"
      - ".github/workflows/ci-compose.yml"

jobs:
  compose-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Check dev compose is in sync with root compose
        run: python3 scripts/sync-dev-compose.py --check
